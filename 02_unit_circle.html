<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Circle: 0°–180°</title><style>body{font-family:Arial,sans-serif;max-width:850px;margin:30px auto;padding:0 18px;color:#222}canvas{width:100%;max-width:650px;border:1px solid #ccc;border-radius:10px}input{width:500px;max-width:90%}.box{background:#f5f5f5;padding:14px;border-radius:10px;font-size:1.1rem}button{font-size:1rem;padding:8px 13px;margin:4px;border:1px solid #aaa;border-radius:8px;background:white;cursor:pointer}button:hover{background:#eee}.buttons{margin:8px 0 18px}.controls{background:#fafafa;padding:12px 14px;border-radius:10px;margin-bottom:14px}</style></head><body><h1>Unit Circle: 0°–180°</h1><p>Move θ around the upper half of the unit circle. The point is <b>(cos θ, sin θ)</b>.</p><p>θ = <b id="d"></b></p><input id="s" type="range" min="0" max="180" value="60"><div class="buttons">Special angles: <button data-a="0">0°</button><button data-a="30">30°</button><button data-a="45">45°</button><button data-a="60">60°</button><button data-a="90">90°</button><button data-a="120">120°</button><button data-a="135">135°</button><button data-a="150">150°</button><button data-a="180">180°</button></div><canvas id="c" width="650" height="430"></canvas><div class="box" id="o"></div><script>const s=document.querySelector('#s'),c=document.querySelector('#c'),g=c.getContext('2d'),d=document.querySelector('#d'),o=document.querySelector('#o');document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{s.value=b.dataset.a;q()}));function q(){let D=+s.value,r=D*Math.PI/180,cx=325,cy=250,R=160,X=cx+R*Math.cos(r),Y=cy-R*Math.sin(r);g.clearRect(0,0,650,430);g.strokeStyle='#222';g.lineWidth=2;g.beginPath();g.arc(cx,cy,R,Math.PI,2*Math.PI);g.stroke();g.beginPath();g.moveTo(70,cy);g.lineTo(580,cy);g.moveTo(cx,370);g.lineTo(cx,50);g.stroke();g.setLineDash([6,5]);g.beginPath();g.moveTo(X,cy);g.lineTo(X,Y);g.moveTo(cx,Y);g.lineTo(X,Y);g.stroke();g.setLineDash([]);g.lineWidth=4;g.beginPath();g.moveTo(cx,cy);g.lineTo(X,Y);g.stroke();g.beginPath();g.arc(X,Y,7,0,7);g.fill();g.font='17px Arial';g.fillText('(cos θ, sin θ)',X+10,Y-10);d.textContent=D+'°';o.innerHTML=`cos ${D}° = <b>${Math.cos(r).toFixed(3)}</b> &nbsp; → x-coordinate<br>sin ${D}° = <b>${Math.sin(r).toFixed(3)}</b> &nbsp; → y-coordinate`;}s.oninput=q;q()</script></body></html>
