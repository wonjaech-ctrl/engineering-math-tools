<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Right-Triangle Sine & Cosine</title><style>body{font-family:Arial,sans-serif;max-width:850px;margin:30px auto;padding:0 18px;color:#222}canvas{width:100%;max-width:700px;border:1px solid #ccc;border-radius:10px}label{display:block;margin:14px 0}input{width:320px;max-width:80%}.box{background:#f5f5f5;padding:14px;border-radius:10px;font-size:1.1rem}button{font-size:1rem;padding:8px 13px;margin:4px;border:1px solid #aaa;border-radius:8px;background:white;cursor:pointer}button:hover{background:#eee}.buttons{margin:8px 0 18px}.controls{background:#fafafa;padding:12px 14px;border-radius:10px;margin-bottom:14px}</style></head><body><h1>Right-Triangle Sine & Cosine</h1><p>Change the angle or the hypotenuse. Watch how the opposite and adjacent sides change.</p><div class="controls"><label>Angle θ: <b id="ang">35°</b><br><input id="a" type="range" min="0" max="90" value="35"></label><div class="buttons">Special angles: <button data-a="0">0°</button><button data-a="30">30°</button><button data-a="45">45°</button><button data-a="60">60°</button><button data-a="90">90°</button></div><label>Hypotenuse: <b id="hv">10.0</b><br><input id="h" type="range" min="1" max="20" step="0.5" value="10"></label></div><canvas id="c" width="700" height="390"></canvas><div class="box" id="out"></div><script>const a=document.querySelector('#a'),h=document.querySelector('#h'),c=document.querySelector('#c'),x=c.getContext('2d'),ang=document.querySelector('#ang'),hv=document.querySelector('#hv'),out=document.querySelector('#out');document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{a.value=b.dataset.a;draw()}));function draw(){let d=+a.value,r=d*Math.PI/180,Hval=+h.value,scale=280/Hval,H=Hval*scale,A=Hval*Math.cos(r),O=Hval*Math.sin(r),Ap=A*scale,Op=O*scale,ox=100,oy=320;x.clearRect(0,0,c.width,c.height);x.lineWidth=4;x.beginPath();x.moveTo(ox,oy);x.lineTo(ox+Ap,oy);x.lineTo(ox+Ap,oy-Op);x.closePath();x.stroke();x.font='18px Arial';x.fillText('adjacent = '+A.toFixed(1),ox+45,oy+30);x.fillText('opposite = '+O.toFixed(1),Math.min(ox+Ap+10,540),oy-Op/2);x.fillText('hypotenuse = '+Hval.toFixed(1),ox+Ap/2-30,oy-Op/2-15);x.fillText('θ = '+d+'°',ox+30,oy-12);ang.textContent=d+'°';hv.textContent=Hval.toFixed(1);out.innerHTML=`sin θ = opposite / hypotenuse = ${O.toFixed(1)} / ${Hval.toFixed(1)} = <b>${Math.sin(r).toFixed(3)}</b><br>cos θ = adjacent / hypotenuse = ${A.toFixed(1)} / ${Hval.toFixed(1)} = <b>${Math.cos(r).toFixed(3)}</b>`}a.oninput=draw;h.oninput=draw;draw()</script></body></html>
