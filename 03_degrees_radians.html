<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Degrees & Radians</title><style>body{font-family:Arial,sans-serif;max-width:850px;margin:30px auto;padding:0 18px;color:#222}canvas{width:100%;max-width:650px;border:1px solid #ccc;border-radius:10px}input{width:500px;max-width:90%}.box{background:#f5f5f5;padding:16px;border-radius:10px;font-size:1.15rem}button{font-size:1rem;padding:8px 13px;margin:4px;border:1px solid #aaa;border-radius:8px;background:white;cursor:pointer}button:hover{background:#eee}.buttons{margin:8px 0 18px}.controls{background:#fafafa;padding:12px 14px;border-radius:10px;margin-bottom:14px}</style></head><body><h1>Degrees & Radians</h1><p>Degrees and radians measure the same angle in different units. Remember: <b>180° = π radians</b>.</p><p>Angle: <b id="v"></b></p><input id="s" type="range" min="0" max="180" step="1" value="90"><div class="buttons">Special angles: <button data-a="0">0°</button><button data-a="30">30°</button><button data-a="45">45°</button><button data-a="60">60°</button><button data-a="90">90°</button><button data-a="120">120°</button><button data-a="135">135°</button><button data-a="150">150°</button><button data-a="180">180°</button></div><canvas id="c" width="650" height="400"></canvas><div class="box" id="o"></div><script>const s=document.querySelector('#s'),c=document.querySelector('#c'),g=c.getContext('2d'),v=document.querySelector('#v'),o=document.querySelector('#o');document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{s.value=b.dataset.a;f()}));function f(){let D=+s.value,r=D*Math.PI/180,cx=325,cy=260,R=150;g.clearRect(0,0,650,400);g.lineWidth=3;g.beginPath();g.arc(cx,cy,R,Math.PI,2*Math.PI);g.stroke();g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+R,cy);g.moveTo(cx,cy);g.lineTo(cx+R*Math.cos(r),cy-R*Math.sin(r));g.stroke();g.beginPath();g.arc(cx,cy,55,-r,0);g.stroke();v.textContent=D+'° = '+r.toFixed(3)+' rad';o.innerHTML=`Radians = degrees × π / 180<br>${D}° × π / 180 = <b>${r.toFixed(3)} rad</b><br><br>This angle is <b>${(D/180).toFixed(3)}</b> of a half-turn.`}s.oninput=f;f()</script></body></html>
