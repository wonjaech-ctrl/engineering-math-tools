<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Vectors & Cartesian Coordinates</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 18px;color:#222}canvas{width:100%;max-width:700px;border:1px solid #ccc;border-radius:10px}.controls{display:flex;gap:25px;flex-wrap:wrap}.box{background:#f5f5f5;padding:14px;border-radius:10px;font-size:1.1rem}input{width:250px}</style></head><body><h1>Vectors & Cartesian Coordinates</h1><p>Change the x- and y-components. The arrow represents the vector <b>(x, y)</b>. Its magnitude comes from the Pythagorean theorem.</p><div class='controls'><label>x = <b id='xv'></b><br><input id='xs' type='range' min='-8' max='8' value='3'></label><label>y = <b id='yv'></b><br><input id='ys' type='range' min='-8' max='8' value='4'></label></div><canvas id='c' width='700' height='560'></canvas><div class='box' id='o'></div><script>const xs=document.querySelector('#xs'),ys=document.querySelector('#ys'),c=document.querySelector('#c'),g=c.getContext('2d'),xv=document.querySelector('#xv'),yv=document.querySelector('#yv'),o=document.querySelector('#o');function f(){let X=+xs.value,Y=+ys.value,cx=350,cy=280,k=28;g.clearRect(0,0,700,560);g.strokeStyle='#ddd';g.lineWidth=1;for(let i=-10;i<=10;i++){g.beginPath();g.moveTo(cx+i*k,20);g.lineTo(cx+i*k,540);g.stroke();g.beginPath();g.moveTo(70,cy+i*k);g.lineTo(630,cy+i*k);g.stroke()}g.strokeStyle='#222';g.lineWidth=2;g.beginPath();g.moveTo(70,cy);g.lineTo(630,cy);g.moveTo(cx,20);g.lineTo(cx,540);g.stroke();let ex=cx+X*k,ey=cy-Y*k;g.setLineDash([5,5]);g.beginPath();g.moveTo(ex,cy);g.lineTo(ex,ey);g.moveTo(cx,ey);g.lineTo(ex,ey);g.stroke();g.setLineDash([]);g.lineWidth=5;g.beginPath();g.moveTo(cx,cy);g.lineTo(ex,ey);g.stroke();g.beginPath();g.arc(ex,ey,7,0,7);g.fill();let m=Math.hypot(X,Y),ang=Math.atan2(Y,X)*180/Math.PI;xv.textContent=X;yv.textContent=Y;o.innerHTML=`Vector = <b>(${X}, ${Y})</b><br>Magnitude = √(${X}² + ${Y}²) = <b>${m.toFixed(3)}</b><br>Direction from +x axis = <b>${(ang<0?ang+360:ang).toFixed(1)}°</b>`}xs.oninput=ys.oninput=f;f()</script></body></html>
